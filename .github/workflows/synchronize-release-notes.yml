name: Synchronize core release notes

on:
  workflow_dispatch:
  schedule:
    # daily at 06:15 UTC (adjust as you like)
    - cron: "15 6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          # If you trust GITHUB_TOKEN for same-repo pushes, you can remove "token:".
          # Keeping DOCS_PUSH_TOKEN makes it robust if you later change the setup.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate release notes from ManiVaultStudio/core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_OWNER: ManiVaultStudio
          CORE_REPO: core
          OUTPUT_DIR: docs/source/release_notes
          INDEX_PATH: docs/source/release_notes/index.md
          FILE_PREFIX: release_note_
          INCLUDE_PRERELEASES: "false"
        run: |
          python .github/scripts/synchronize_releases.py

      - name: Create Pull Request if changed
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: docs/sync-core-release-notes
          base: main
          title: "docs: sync core release notes"
          body: "Automated sync of ManiVaultStudio/core release notes."
          commit-message: "docs: sync core release notes"
          add-paths: |
            docs/source/release_notes
